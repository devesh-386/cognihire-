# Runs the test suites that already exist and, until now, nothing ever ran.
#
# `guardrails.yml` is release-blocking and runs on every push/PR, but it only
# lints identifier spelling in lib/ and the schema of a database plane the
# app doesn't use. 268 backend tests and a Flutter suite sat in the repo,
# unexecuted by any CI job — which is how the /interview/event 503 race and
# the live-voice connect deadlock both reached production this week: both
# are exactly the class a test that runs would catch. This is that job.
name: Tests

on:
  push:
  pull_request:

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches service/Dockerfile's python:3.11-slim. CI ran 3.12 while
          # production ran 3.11, so a failure that only appears on one of
          # them was invisible here in exactly the direction that matters.
          python-version: "3.11"

      # opencv/insightface's system deps — mirrors service/Dockerfile so
      # `import cv2` doesn't fail here the way it does without them.
      - name: System libraries for opencv/insightface
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 libxcb1

      # Install from the lock, with hashes enforced, exactly as the image
      # does. Installing floating requirements.txt here meant CI proved its
      # results against whatever PyPI served that minute, while the deploy
      # shipped the pinned set — green here was never evidence about the
      # thing that actually runs. It also makes every push a real check
      # that the lock resolves and its digests match on linux/cp311.
      - name: Install dependencies
        working-directory: service
        run: pip install --require-hashes -r requirements.lock

      - name: pytest
        working-directory: service
        run: pytest -q

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: flutter pub get
        run: flutter pub get

      - name: flutter test
        # test/preview/*.dart (@Tags(['preview'])) renders screens to PNGs
        # for visual review, not assertions — its own doc comment says so
        # ("nothing fails if pixels change"). It still needs a real network
        # fetch for Google Fonts, which this runner (and most CI sandboxes)
        # can't reach, so it failed on an unrelated network error, not a
        # pixel diff, on every run. Excluded from the gating run; still
        # runnable directly with `flutter test test/preview
        # --update-goldens` when a developer wants to regenerate the shots.
        run: flutter test --exclude-tags=preview

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30's own dependency tree (undici, whatwg-url,
          # @asamuzakjp/*) requires Node >=22 — Node 20 fails at import time
          # with `webidl.util.markAsUncloneable is not a function` before a
          # single test runs, not a real test failure. 24 matches what's
          # actually verified locally (`node --version`), not just the
          # nearest version that satisfies the constraint.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: portal/package-lock.json

      - name: npm ci
        working-directory: portal
        run: npm ci

      - name: npm test
        working-directory: portal
        run: npm test
