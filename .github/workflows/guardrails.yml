# CH-0.2.1 / CH-0.2.2 / CH-0.2.3 — release-blocking guardrail gate.
#
# Per the Handbook's five defining decisions and ED-65/ED-71: product-
# guarantee regression tests are security tests, and a red guardrail build
# blocks release. This job runs the vocabulary-ban linter and its self-test
# (proving the linter itself still correctly catches a planted violation,
# not just that today's code happens to be clean).
#
# The evidence<->disposition schema linter (ED-45) that used to run here was
# removed: it scanned for a `*disposition*` migrations directory convention
# that Epic 5's disposition service — the thing it was written ahead of —
# was never built. `infra/migrations/` is flat, Supabase-only, and has no
# such directory; the linter was permanently green about a rule with
# nothing to violate, the same "CI that proves nothing" pattern as the
# removed compose-smoke/stack-smoke/disposition-isolation workflows.
name: Guardrails (ED-46 / ED-65 / ED-71)

on:
  push:
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vocabulary-ban self-test (ED-46 / ED-03 / ED-04)
        run: python tools/lint/test_vocab_ban.py

      - name: Vocabulary-ban linter — real lib/ tree
        run: python tools/lint/vocab_ban.py
