name: Deploy backend to Azure VM

# Ticket 20 follow-up (item 7 on the "next engineering tasks" list): every
# push to this branch redeploys the FastAPI service automatically, instead
# of someone SSHing in and running `git pull && docker compose up -d` by
# hand. Manual dispatch is kept too, for redeploying without a new commit
# (e.g. after rotating a secret in the VM's own .env).
on:
  push:
    branches: [infra/foundations-epic0]
    paths:
      - "service/**"
      - "docker-compose.api.yml"
      - "infra/migrations/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script_stop: true
          # The build pulls system packages and Python wheels; 10 minutes is
          # not always enough on a 2-vCPU box doing it cold.
          command_timeout: 25m
          script: |
            set -e
            cd ~/CogniHire

            git fetch origin

            # The VM carries hand-written copies of files the repo now owns
            # (service/Dockerfile with the OpenCV libs, a compose file) from
            # the original manual deploy. They are UNTRACKED there, and
            # `checkout -f` refuses to clobber untracked files — it only
            # forces past modified *tracked* ones. So clean first.
            #
            # NO `-x`: that would also delete gitignored files, and `.env`
            # on this box holds the Supabase service-role key. Without -x,
            # git clean leaves ignored files alone, so the secrets survive
            # every deploy. Do not add -x here.
            git clean -fd
            git checkout -f infra/foundations-epic0
            git reset --hard origin/infra/foundations-epic0
            echo "Deploying commit: $(git rev-parse --short HEAD)"

            # -f docker-compose.api.yml: the root docker-compose.yml is the
            # local dev infra stack (Postgres/Redis/MinIO/Caddy) and contains
            # no application service. Using it here would start databases,
            # leave the old API container untouched, and still pass the
            # health check below — a green deploy that shipped nothing.
            docker compose -f docker-compose.api.yml build
            docker compose -f docker-compose.api.yml up -d

            # InsightFace loads ~300MB of models on a cold start; poll rather
            # than guessing a fixed sleep.
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8000/health > /tmp/health.json 2>/dev/null; then
                break
              fi
              echo "waiting for the service to come up ($i/30)..."
              sleep 5
            done

            cat /tmp/health.json
            echo

            # Assert the running container is actually the NEW build. Without
            # this, a build that silently failed to replace the old container
            # still answers /health and reports success. `llm_provider` only
            # exists in the post-Ticket-20 health payload.
            if ! grep -q "llm_provider" /tmp/health.json; then
              echo "FAILED: /health has no llm_provider field — the old build is still running."
              docker compose -f docker-compose.api.yml logs --tail=50 api
              exit 1
            fi

      - name: Confirm the public endpoint is live and current
        run: |
          curl -fsS https://api.cognihire.online/health | tee health.json
          echo
          grep -q "llm_provider" health.json || {
            echo "Public endpoint is serving the old build."
            exit 1
          }
