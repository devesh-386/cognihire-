name: Deploy backend to Azure VM

# Ticket 20 follow-up (item 7 on the "next engineering tasks" list): every
# push to this branch redeploys the FastAPI service automatically, instead
# of someone SSHing in and running `git pull && docker compose up -d` by
# hand. Manual dispatch is kept too, for redeploying without a new commit
# (e.g. after rotating a secret in the VM's own .env).
#
# Gated on the Tests workflow (.github/workflows/test.yml) actually
# succeeding on this branch — before this, nothing ran the 268 backend
# tests, the Flutter suite, or the portal suite at all, so a broken commit
# deployed exactly as readily as a working one. `needs:` only applies within
# one workflow file; `workflow_run` is the cross-workflow equivalent, and
# it's why this can no longer trigger on a plain `push` — it has to wait for
# Tests to report a conclusion first. The `paths` filter that used to scope
# this to service/infra changes is gone with it: `workflow_run` doesn't
# support path filtering, and Tests already fires on every push, so gating
# on Tests implicitly still means "something changed", just not scoped to
# which files.
#
# `main` is the deploy branch (Phase 2.3 of the remediation plan). This
# filter still said `infra/foundations-epic0` long after PRs started
# merging into `main`, so a merge to `main` ran Tests, went green, and then
# deployed nothing — while the deploy history still looked healthy, because
# every commit that did deploy happened to sit on BOTH branches. PR #5 was
# the first merge to land on `main` alone, and it silently never shipped.
#
# Deliberately ONE branch, not both: two branches auto-deploying to a single
# VM race each other, and whichever finishes last decides what is actually
# running.
#
# The branch name appears FOUR times in this file: this trigger filter, the
# runner's checkout `ref:`, and the VM's `git checkout -f` / `git reset
# --hard origin/...`. They must all name the same branch. Changing only the
# trigger makes the deploy fire on the right branch and then ship a
# different one — and every freshness assertion below still passes, because
# the runner and the VM would agree with each other about the wrong commit.
on:
  workflow_run:
    workflows: ["Tests"]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_dispatch has no `workflow_run` payload to check — always
    # deploy on a manual run. A workflow_run trigger deploys only if Tests
    # actually passed; a failed or cancelled Tests run must not ship.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Resolve the commit being deployed
        # Independent of the VM's own `git rev-parse` inside the SSH
        # script below — this runner's checkout is what both this step's
        # output AND the final "Confirm the public endpoint" step need, and
        # a value computed only inside the SSH script never leaves that
        # step's shell.
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record the commit SHA as a step output
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: SSH in and redeploy
        # Pinned to a commit SHA, not the v1.0.3 tag. A git tag is mutable:
        # the maintainer can repoint it, and so can anyone who takes over
        # that account. This step is handed AZURE_VM_SSH_KEY — root SSH
        # access to the production VM — so "whatever v1.0.3 happens to mean
        # on the day we deploy" is not a good enough answer for what code
        # gets to read it. The trailing comment keeps the human-readable
        # version visible; update both together.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script_stop: true
          # The build pulls system packages and Python wheels; 10 minutes is
          # not always enough on a 2-vCPU box doing it cold.
          command_timeout: 25m
          script: |
            set -e
            cd ~/CogniHire

            git fetch origin

            # The VM carries hand-written copies of files the repo now owns
            # (service/Dockerfile with the OpenCV libs, a compose file) from
            # the original manual deploy. They are UNTRACKED there, and
            # `checkout -f` refuses to clobber untracked files — it only
            # forces past modified *tracked* ones. So clean first.
            #
            # NO `-x`: that would also delete gitignored files, and `.env`
            # on this box holds the Supabase service-role key. Without -x,
            # git clean leaves ignored files alone, so the secrets survive
            # every deploy. Do not add -x here.
            git clean -fd
            git checkout -f main
            git reset --hard origin/main

            export GIT_SHA="${{ steps.resolve.outputs.sha }}"
            echo "Deploying commit: $GIT_SHA"
            # The VM's own HEAD must actually match what the runner resolved
            # above — if it doesn't, `origin/main` moved
            # between this workflow starting and this line running, and the
            # freshness check below would otherwise pass while checking for
            # the wrong commit.
            if [ "$(git rev-parse HEAD)" != "$GIT_SHA" ]; then
              echo "FAILED: VM HEAD ($(git rev-parse HEAD)) does not match the resolved deploy commit ($GIT_SHA)."
              exit 1
            fi

            # -f docker-compose.api.yml: the root docker-compose.yml is the
            # local dev infra stack (Postgres/Redis/MinIO/Caddy) and contains
            # no application service. Using it here would start databases,
            # leave the old API container untouched, and still pass the
            # health check below — a green deploy that shipped nothing.
            docker compose -f docker-compose.api.yml build

            # Build first, remove second: if the build fails, script_stop
            # aborts here and the currently-serving container is left alone,
            # rather than being killed with nothing to replace it.
            #
            # The original manual deploy created `cognihire-face-service`
            # from a hand-written compose file that `git clean` has now
            # removed, so Compose treats it as an orphan it doesn't own and
            # collides on both the container name and port 8000. Explicit
            # removal is deterministic where relying on --remove-orphans
            # ordering is not. Harmless once it no longer exists.
            docker rm -f cognihire-face-service 2>/dev/null || true
            docker compose -f docker-compose.api.yml up -d --remove-orphans

            # InsightFace loads ~300MB of models on a cold start; poll rather
            # than guessing a fixed sleep.
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8000/health > /tmp/health.json 2>/dev/null; then
                break
              fi
              echo "waiting for the service to come up ($i/30)..."
              sleep 5
            done

            cat /tmp/health.json
            echo

            # Assert the running container is actually the NEW build. Without
            # this, a build that silently failed to replace the old container
            # still answers /health and reports success. `llm_provider` used
            # to be this check, but it's present in every build regardless of
            # which commit shipped it — checking for the exact commit just
            # deployed is the only thing that actually proves freshness.
            if ! grep -qE "\"git_sha\":[[:space:]]*\"$GIT_SHA\"" /tmp/health.json; then
              echo "FAILED: /health is not reporting git_sha=$GIT_SHA — the old build is still running."
              docker compose -f docker-compose.api.yml logs --tail=50 api
              exit 1
            fi

      - name: Confirm the public endpoint is live and current
        run: |
          curl -fsS https://api.cognihire.online/health | tee health.json
          echo
          GIT_SHA="${{ steps.resolve.outputs.sha }}"
          grep -qE "\"git_sha\":[[:space:]]*\"$GIT_SHA\"" health.json || {
            echo "Public endpoint is not reporting git_sha=$GIT_SHA — serving the old build (or a proxy/CDN cache)."
            exit 1
          }
