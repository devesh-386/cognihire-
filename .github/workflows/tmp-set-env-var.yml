# TEMPORARY, one-off utility — set GOOGLE_TOKEN_ENCRYPTION_KEY in the VM's
# .env and restart the api container to pick it up. Manual dispatch only,
# never runs automatically. Deleted after use — never merged as a lasting
# fixture, so this capability doesn't sit around as a standing "write
# arbitrary secrets to the VM" button for anyone with push access.
#
# The value comes from a real GitHub Actions secret (TEMP_GOOGLE_TOKEN_
# ENCRYPTION_KEY), not a workflow_dispatch input — a plain input is never
# masked in logs (learned the hard way: an earlier version of this file
# passed the key as an input and GitHub's own step-debug "env:" block
# printed it in cleartext). A `secrets.*` reference is masked everywhere
# GitHub renders it, including this exact debug block.
name: TEMP - set env var on VM

on:
  workflow_dispatch: {}

jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in, upsert the var, restart api
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script_stop: false
          envs: KEY_VALUE
          command_timeout: 10m
          debug: true
          script: |
            cd ~/CogniHire || { echo "FAILED: could not cd to ~/CogniHire"; exit 1; }
            echo "step 1: cd ok"

            # tool/ isn't in the image (build context is ./service only) —
            # copy the script into the running container's /app so it can
            # import `security.token_crypto` the same way main.py does
            # (Python auto-adds a script's own directory to sys.path[0]).
            CONTAINER=$(docker compose -f docker-compose.api.yml ps -q api)
            if [ -z "$CONTAINER" ]; then
              echo "FAILED: no running api container found"; exit 1
            fi
            docker cp tool/reencrypt_google_tokens.py "$CONTAINER":/app/reencrypt_google_tokens.py \
              && echo "step 2: script copied into container" \
              || echo "step 2 FAILED: docker cp"

            echo "step 3: dry run"
            docker compose -f docker-compose.api.yml exec -T api \
              python reencrypt_google_tokens.py --dry-run \
              || echo "step 3 FAILED: dry-run exited non-zero"

            echo "step 4: apply"
            docker compose -f docker-compose.api.yml exec -T api \
              python reencrypt_google_tokens.py --apply \
              || echo "step 4 FAILED: apply exited non-zero"

            echo "step 5: re-run dry-run to confirm — should report 'already encrypted'"
            docker compose -f docker-compose.api.yml exec -T api \
              python reencrypt_google_tokens.py --dry-run \
              || echo "step 5 FAILED: confirmation dry-run exited non-zero"

            docker compose -f docker-compose.api.yml exec -T api \
              rm -f /app/reencrypt_google_tokens.py
            echo "step 6: cleanup done"
        env:
          KEY_VALUE: ${{ secrets.TEMP_GOOGLE_TOKEN_ENCRYPTION_KEY }}
