# TEMPORARY, one-off utility — set GOOGLE_TOKEN_ENCRYPTION_KEY in the VM's
# .env and restart the api container to pick it up. Manual dispatch only,
# never runs automatically. Deleted after use — never merged as a lasting
# fixture, so this capability doesn't sit around as a standing "write
# arbitrary secrets to the VM" button for anyone with push access.
#
# The value comes from a real GitHub Actions secret (TEMP_GOOGLE_TOKEN_
# ENCRYPTION_KEY), not a workflow_dispatch input — a plain input is never
# masked in logs (learned the hard way: an earlier version of this file
# passed the key as an input and GitHub's own step-debug "env:" block
# printed it in cleartext). A `secrets.*` reference is masked everywhere
# GitHub renders it, including this exact debug block.
name: TEMP - set env var on VM

on:
  workflow_dispatch: {}

jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in, upsert the var, restart api
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script_stop: false
          envs: KEY_VALUE
          command_timeout: 10m
          debug: true
          script: |
            cd ~/CogniHire
            echo "step 1: cd ok"
            pwd
            echo "step 2: KEY_VALUE length is ${#KEY_VALUE}"
        env:
          KEY_VALUE: ${{ secrets.TEMP_GOOGLE_TOKEN_ENCRYPTION_KEY }}
