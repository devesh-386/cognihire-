name: SSH connectivity test (diagnostic, safe to delete)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Minimal SSH echo test
        uses: appleboy/ssh-action@v1.0.3
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          debug: true
          script_stop: true
          envs: SMTP_HOST,SMTP_USERNAME,SMTP_PASSWORD
          script: |
            set -e
            cd ~/CogniHire
            echo "step 1: cd ok"

            set_env_var() {
              local key="$1"
              local value="$2"
              if grep -q "^${key}=" .env 2>/dev/null; then
                sed -i "s#^${key}=.*#${key}=${value}#" .env
              else
                echo "${key}=${value}" >> .env
              fi
            }
            echo "step 2: function defined ok"

            set_env_var SMTP_HOST "$SMTP_HOST"
            echo "step 3: set_env_var SMTP_HOST ok"
            set_env_var SMTP_USERNAME "$SMTP_USERNAME"
            echo "step 4: set_env_var SMTP_USERNAME ok"
            set_env_var SMTP_PASSWORD "$SMTP_PASSWORD"
            echo "step 5: set_env_var SMTP_PASSWORD ok"

            grep -E "^SMTP_(HOST|USERNAME|PASSWORD)=" .env | sed 's/=.*/=[REDACTED]/'
            echo "step 6: verified .env contents"

            docker compose -f docker-compose.api.yml up -d --force-recreate api
            echo "step 7: docker compose ok"
