# Reverse proxy for the cloud VM (Ticket 9): fronts local-only Ollama (11434)
# and the face service (8000) with one public HTTPS domain, split by path so
# only one cert/DNS entry is needed. Run `certbot --nginx -d <domain>` after
# this is in sites-enabled — it edits this file in place to add the TLS block.
server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;

    location /ollama/ {
        proxy_pass http://127.0.0.1:11434/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;   # interview turns can take a while to stream
    }

    location /face/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        client_max_body_size 10m; # face frames
    }
}
